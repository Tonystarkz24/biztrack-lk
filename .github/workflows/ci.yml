name: BizTrack LK Continuous Integration

on:
  push:
    branches: [ main, kamsha, pavesh, sathira, subanujan ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Build & Automated Tests (ASP.NET Core 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/BizTrack.Api.csproj

      - name: Build Backend Web API
        run: dotnet build backend/BizTrack.Api.csproj --no-restore --configuration Release

      - name: Run Backend & Agentic AI Tests
        run: dotnet test tests/BizTrack.Api.Tests/BizTrack.Api.Tests.csproj --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Client Verification (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build
