name: BizTrack LK Continuous Integration

on:
  push:
    branches: [ main, kamsha, pavesh, sathira, subanujan, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Build & Automated Tests (ASP.NET Core 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/BizTrack.Api.csproj

      - name: Build Backend Web API
        run: dotnet build backend/BizTrack.Api.csproj --no-restore --configuration Release

      - name: Run Backend & Agentic AI Tests
        run: dotnet test tests/BizTrack.Api.Tests/BizTrack.Api.Tests.csproj --configuration Release --verbosity normal

  frontend-verify:
    name: Frontend Verification & Tests (React + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run React Component & Service Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  mobile-verify:
    name: Mobile Verification & Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload Runnable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biztrack-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
